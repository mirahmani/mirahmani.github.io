<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miranti Rahmani — Business Intelligence Engineer</title>
    <meta
      name="description"
      content="Business Intelligence Engineer building data platforms, analytics, and automation."
    />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="shell">
      <header class="site-header">
        <div class="wrap site-header__inner">
          <a class="logo" href="index.html" data-logo>Mira<span>.</span></a>
          <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Menu">
            <span></span><span></span>
          </button>
          <ul class="nav" data-nav></ul>
        </div>
      </header>

      <main id="main">
        <section class="hero">
          <div class="wrap hero__layout">
            <div class="reveal">
              <p class="hero__eyebrow" data-role>Business Intelligence Engineer</p>
              <h1 class="brand" data-brand>Miranti<br /><em>Rahmani</em></h1>
              <p class="hero__headline" data-headline></p>
              <p class="hero__lede" data-lede></p>
              <div class="actions" data-actions></div>
            </div>
          </div>
        </section>

        <section class="section section--split" id="about">
          <div class="wrap reveal">
            <p class="kicker">Profile</p>
            <h2 class="section__title" data-about-title>About</h2>
            <div class="prose" style="margin-top: 1.25rem" data-about></div>
          </div>
        </section>

        <section class="section" id="focus">
          <div class="wrap">
            <div class="reveal">
              <p class="kicker">Practice</p>
              <h2 class="section__title" data-focus-title>How I work</h2>
            </div>
            <ul class="focus-grid reveal reveal-d1" data-focus style="margin-top: 1.75rem"></ul>
          </div>
        </section>

        <section class="section section--split" id="work">
          <div class="wrap">
            <div class="section__head reveal">
              <div>
                <p class="kicker">Selected</p>
                <h2 class="section__title">Recent work</h2>
              </div>
              <a class="link-quiet" href="projects.html">All projects</a>
            </div>
            <ul class="project-index reveal reveal-d1" data-featured></ul>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="wrap site-footer__inner">
          <p class="site-footer__brand" data-footer-brand>Miranti Rahmani</p>
          <ul class="social" data-social></ul>
        </div>
      </footer>
    </div>

    <script src="content/site.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
